# Publish on a tag, then create the matching GitHub release. The mise tasks
# `release-check` and `publish` enforce the version rules and the gates. Shell
# steps in this file do not. The same refusal that stops a contributor locally
# therefore also stands between a mistyped tag and a version number on
# crates.io that can never change.
#
# Configure these before the workflow can work:
#
#   1. Store a crates.io API token with the publish scope as the repository
#      secret CARGO_REGISTRY_TOKEN.
#   2. Optional: name a repository environment `crates-io` and add required
#      reviewers. A release then needs two people. The `environment` key below
#      creates it on the first run if it does not exist.
#
# The release job needs no secret. It authenticates with the automatic
# `GITHUB_TOKEN`, scoped to that job alone.
#
# To release: run `git tag v0.1.0 && git push origin v0.1.0`.

name: Release

on:
  push:
    tags: ['v*']
  # A dispatch from a tag in the UI sets GITHUB_REF_NAME to the tag, so the
  # version rule below still applies. A dispatch from a branch fails that
  # rule, which is the correct outcome.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    # A tag push in a fork would otherwise start a publish job that has no
    # secret to publish with.
    if: github.repository == 'thomascjohnson/axum_oidc_middleware'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          # `release-check` can fall back to asking whether the tag sits
          # exactly on HEAD. That needs more than the single checked-out commit.
          fetch-depth: 0

      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2.9.3

      # `mise run publish` depends on `ci` and `release-check`, so this job runs
      # the full gate set again. It does not trust that ci.yml was green on this
      # commit. That duplicates work on purpose. You can yank a publish, but you
      # cannot unpublish it.
      - run: mise run publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: create the GitHub release
    # This job follows publish out of necessity, not tidiness. A release that
    # announces v0.1.0 for a build that failed to upload points at a version you
    # cannot publish again. crates.io never accepts the same number twice.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This is the only write access in the automation of this repository, and it
    # serves exactly one API call. `ci.yml` and `security.yml` stay at
    # `contents: read`.
    permissions:
      contents: write
    steps:
      # No checkout step. Every command here is one API call, and `-R` names the
      # repository, so none of them resolves it from a working tree. GitHub
      # computes `--generate-notes` from merged pull requests, not from git.
      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"

          if gh release view "$GITHUB_REF_NAME" -R "$repo" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it as is"
            exit 0
          fi

          # The tag has to exist in the repository, so a re-run from a branch
          # cannot invent a release for a version nobody tagged. Ask the API:
          # the repository holds the answer. `--verify-tag` asked a local git
          # tree instead, and this job has none. It aborted on v0.1.0 with
          # "failed to run git: fatal: not a git repository". The guard above
          # turns a re-run after a partial failure into a no-op.
          gh api "repos/$repo/git/ref/tags/$GITHUB_REF_NAME" >/dev/null

          # `--target` pins the release to the commit this run built from.
          # That is what the tag names here.
          gh release create "$GITHUB_REF_NAME" \
            -R "$repo" \
            --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

          gh release view "$GITHUB_REF_NAME" -R "$repo" --json url -q .url
